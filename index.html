<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>LinkZip — Client-Side URL Compressor & QR Optimizer</title>
  <meta name="description" content="Zero-backend URL compressor and ISO QR optimizer. Strip tracking parameters, reduce link length, and generate phone-scannable QR codes client-side.">
  <meta name="theme-color" content="#1d4ed8">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="LinkZip — Client-Side URL Compressor & QR Optimizer">
  <meta property="og:description" content="Shorten the link. Sharpen the QR. Runs entirely in your browser with zero tracking.">
  <meta property="og:url" content="https://linkcp.vercel.app/">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="LinkZip — Client-Side URL Compressor & QR Optimizer">
  <meta name="twitter:description" content="Shorten the link. Sharpen the QR. Runs entirely in your browser with zero tracking.">

  <!-- Anti-flash theme script (Runs before DOM render) -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('linkzip_theme');
        var theme = saved;
        if (!theme || theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231d4ed8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='18' height='18' x='3' y='3' rx='2'/><path d='M7 7h.01'/><path d='M17 7h.01'/><path d='M7 17h.01'/><path d='M17 17h.01'/></svg>">
</head>
<body>
  <noscript>
    <div style="padding: 2rem; background: #0c0e12; color: #f8fafc; font-family: -apple-system, sans-serif;">
      <h1>LinkZip</h1>
      <p>A client-side, zero-backend URL compressor and QR code optimizer. Please enable JavaScript to use this application.</p>
    </div>
  </noscript>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
