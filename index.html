<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkZip — 3D Gamified URL Compressor & QR Optimizer</title>
  <meta name="description" content="Shrink any link into a tiny short link and a scannable QR code, right in your browser. No sign-up, no server, no tracking.">

  <!-- Icons -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#06110C" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FAF8F3" media="(prefers-color-scheme: light)">

  <!-- Link previews (WhatsApp, iMessage, Slack, X, LinkedIn…). __SITE_URL__ is filled in at build time. -->
  <link rel="canonical" href="__SITE_URL__/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="LinkZip">
  <meta property="og:title" content="LinkZip — shrink any link into a tiny, scannable code">
  <meta property="og:description" content="Short links, scannable QR codes, and emoji links, made entirely in your browser. No sign-up, no server.">
  <meta property="og:url" content="__SITE_URL__/">
  <meta property="og:image" content="__SITE_URL__/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="LinkZip logo with the tagline “Shrink any link into a tiny, scannable code” beside a QR code.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="LinkZip — shrink any link into a tiny, scannable code">
  <meta name="twitter:description" content="Short links, scannable QR codes, and emoji links, made entirely in your browser.">
  <meta name="twitter:image" content="__SITE_URL__/og-image.png">

  <!-- Apply the saved (or device) colour theme before first paint to avoid a flash. -->
  <script>
    (function () {
      var theme = 'dark';
      try {
        var saved = localStorage.getItem('linkzip_theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
      } catch (e) { /* storage blocked: keep dark */ }
      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <!-- Preconnect & Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Fallback noscript for SEO & capability -->
  <noscript>
    <div style="padding: 2rem; background: #0B0D12; color: #F2F4F8; font-family: sans-serif;">
      <h1>LinkZip</h1>
      <p>A client-side, zero-backend URL compressor and QR code optimizer.</p>
    </div>
  </noscript>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
