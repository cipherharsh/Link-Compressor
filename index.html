<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkZip — Client‑Side URL Compressor</title>
  <meta name="description" content="Compress long URLs into short, shareable strings and optimized QR codes — entirely in your browser, no server required.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ─── Header ──────────────────────────────────────────────────── -->
  <header class="header">
    <h1><span class="emoji">🔗</span> LinkZip</h1>
    <div class="header-actions">
      <button class="btn-icon" id="btn-settings" title="Settings" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <!-- ─── Main ────────────────────────────────────────────────────── -->
  <main class="container">

    <!-- Mode Toggle -->
    <div class="mode-toggle" role="tablist">
      <button id="tab-compress" class="active" role="tab" aria-selected="true">Compress</button>
      <button id="tab-decode" role="tab" aria-selected="false">Decode</button>
    </div>

    <!-- ═══ Compress Mode ═══ -->
    <section id="compress-panel">
      <div class="card">
        <div class="card-title">Paste a URL</div>
        <div class="input-group">
          <input type="url" id="input-url" placeholder="https://example.com/very/long/path?with=params" autocomplete="off" spellcheck="false">
        </div>
        <div class="error-msg" id="compress-error"></div>
      </div>

      <!-- Result -->
      <div class="card result-area" id="result-card">
        <div class="card-title">Compressed Link</div>
        <div class="result-link">
          <span class="link-text" id="result-text"></span>
          <button class="btn-icon" id="btn-copy" title="Copy to clipboard">📋</button>
        </div>
        <div id="ratio-badge" class="ratio-badge"></div>

        <!-- QR Code -->
        <div class="card-title" style="margin-top:1.25rem">QR Code</div>
        <div class="qr-section">
          <div class="qr-canvas-wrap">
            <canvas id="qr-canvas"></canvas>
          </div>
          <div class="qr-info">
            <span id="qr-version">Version: —</span>
            <span id="qr-mode">Mode: —</span>
            <div class="qr-actions">
              <button class="btn btn-secondary" id="btn-dl-png">PNG</button>
              <button class="btn btn-secondary" id="btn-dl-svg">SVG</button>
            </div>
          </div>
        </div>

        <!-- Compression Breakdown -->
        <div class="card-title" style="margin-top:1.25rem">Compression Breakdown</div>
        <div id="breakdown-container"></div>

        <!-- Badge -->
        <div class="card-title" style="margin-top:1.25rem">Share Badge</div>
        <div class="badge-section">
          <div class="badge-preview" id="badge-preview"></div>
          <div class="badge-actions">
            <button class="btn btn-secondary" id="btn-badge-md" title="Copy Markdown">MD</button>
            <button class="btn btn-secondary" id="btn-badge-html" title="Copy HTML">HTML</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ═══ Decode Mode ═══ -->
    <section id="decode-panel" style="display:none">
      <div class="card">
        <div class="card-title">Paste a compressed string</div>
        <div class="input-group">
          <input type="text" id="input-decode" placeholder="Paste compressed string here…" autocomplete="off" spellcheck="false">
        </div>
        <div class="error-msg" id="decode-error"></div>
      </div>

      <div class="card result-area" id="decode-result-card">
        <div class="card-title">Original URL</div>
        <div class="result-link">
          <a class="link-text" id="decode-result-text" href="#" target="_blank" rel="noopener"></a>
          <button class="btn-icon" id="btn-copy-decoded" title="Copy URL">📋</button>
        </div>
      </div>
    </section>
  </main>

  <!-- ─── Settings Modal ──────────────────────────────────────────── -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <h2>⚙️ Settings</h2>

      <label for="setting-domain">Active Short Domain</label>
      <input type="text" id="setting-domain" placeholder="linkzip.pages.dev">

      <label>Domain Profiles</label>
      <ul class="domain-list" id="domain-list"></ul>
      <div class="input-group" style="margin-top:0.5rem">
        <input type="text" id="new-profile-name" placeholder="Name">
        <input type="text" id="new-profile-domain" placeholder="your‑domain.com">
        <button class="btn btn-primary" id="btn-add-profile">Add</button>
      </div>

      <label for="setting-ec">QR Error Correction</label>
      <select id="setting-ec">
        <option value="L">Low (L) — 7% recovery</option>
        <option value="M" selected>Medium (M) — 15% recovery</option>
        <option value="Q">Quartile (Q) — 25% recovery</option>
        <option value="H">High (H) — 30% recovery</option>
      </select>

      <label for="setting-theme">Theme</label>
      <select id="setting-theme">
        <option value="auto">Auto (system)</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>

      <div class="modal-actions">
        <button class="btn btn-secondary" id="btn-close-settings">Close</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- ─── Footer ──────────────────────────────────────────────────── -->
  <footer class="footer">
    Built with zero servers. Compression runs entirely in your browser.<br>
    <a href="https://github.com" target="_blank">GitHub</a> · MIT License
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
