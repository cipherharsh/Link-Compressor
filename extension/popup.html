<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkZip</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      color: #333;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
    }
    .url-box, .result-box {
      background: #f5f5f5;
      padding: 8px;
      border-radius: 4px;
      word-break: break-all;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .stats {
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
    }
    button {
      background: #0066cc;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 8px;
    }
    button:hover {
      background: #0052a3;
    }
    .qr-placeholder {
      width: 200px;
      height: 200px;
      background: #eee;
      margin: 16px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #ccc;
      text-align: center;
      padding: 10px;
      font-size: 12px;
      word-break: break-all;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h2>LinkZip</h2>
  
  <div>Original URL:</div>
  <div id="original-url" class="url-box">Loading...</div>
  
  <div>Compressed URL:</div>
  <div id="compressed-url" class="result-box"></div>
  
  <div class="stats" id="stats"></div>
  
  <button id="copy-btn">Copy to Clipboard</button>
  
  <div id="qr-container" class="hidden">
    <div class="qr-placeholder" id="qr-display">
      <!-- QR placeholder -->
    </div>
  </div>

  <!-- Load standalone bundle and then popup logic -->
  <script src="standalone-bundle.js"></script>
  <script src="popup.js"></script>
</body>
</html>
