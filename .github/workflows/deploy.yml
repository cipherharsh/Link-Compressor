name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pages serves this project site under /Link-Compressor/. The build also
      # emits public/404.html, the short-link decoder Pages serves for unmatched paths.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /Link-Compressor/
          # Absolute site URL for link-preview tags (og:image must be absolute).
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      # Requires Pages to be enabled once with Settings -> Pages -> Source:
      # "GitHub Actions"; the default workflow token cannot create the site.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
