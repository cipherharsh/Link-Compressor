<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkZip — Redirecting…</title>
  <style>
    :root { color-scheme: light dark; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: light-dark(#f8f9fa, #0f172a);
      color: light-dark(#1a1a2e, #e2e8f0);
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 500px;
    }
    h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
    p  { color: light-dark(#6b7280, #94a3b8); margin-bottom: 1rem; font-size: 0.95rem; }
    .spinner {
      width: 40px; height: 40px; margin: 1.5rem auto;
      border: 4px solid light-dark(#e5e7eb, #334155);
      border-top-color: light-dark(#4f46e5, #818cf8);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a {
      color: light-dark(#4f46e5, #818cf8);
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { text-decoration: underline; }
    .error { display: none; }
    .error.visible { display: block; }
    .decoded-url {
      word-break: break-all;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      background: light-dark(#f1f5f9, #1e293b);
      padding: 0.75rem;
      border-radius: 8px;
      margin: 1rem 0;
      text-align: left;
    }
    .actions { display: flex; gap: 0.5rem; justify-content: center; margin-top: 1rem; }
    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-primary { background: light-dark(#4f46e5, #818cf8); color: #fff; }
    .btn-secondary { background: light-dark(#e5e7eb, #334155); color: light-dark(#1a1a2e, #e2e8f0); }
  </style>
</head>
<body>
  <div class="container">
    <!-- Loading state -->
    <div id="loading">
      <h1>🔗 LinkZip</h1>
      <p>Decompressing and redirecting…</p>
      <div class="spinner"></div>
    </div>

    <!-- Success state (brief flash before redirect) -->
    <div id="success" style="display:none">
      <h1>🔗 Redirecting</h1>
      <p>Taking you to:</p>
      <div class="decoded-url" id="decoded-url"></div>
      <div class="actions">
        <a class="btn btn-primary" id="go-link" href="#">Go now</a>
      </div>
    </div>

    <!-- Error state -->
    <div id="error-state" style="display:none">
      <h1>😕 Invalid Link</h1>
      <p>This compressed link couldn't be decoded. It may be corrupted or from a different version of LinkZip.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Open LinkZip</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { decode } from "./src/standalone.js";

    (async function () {
      // 1. Try payload from hash (e.g. #/ABC or #ABC)
      let payload = "";
      if (window.location.hash && window.location.hash.length > 1) {
        payload = window.location.hash.replace(/^#\/?/, "");
      }
      
      // 2. Try payload from query param (e.g. ?c=ABC or ?ABC)
      if (!payload && window.location.search && window.location.search.length > 1) {
        const params = new URLSearchParams(window.location.search);
        payload = params.get("c") || params.get("p") || params.get("l") || window.location.search.slice(1);
      }

      // 3. Try last segment of pathname (e.g. /Link-Compressor/ABC -> ABC or /ABC -> ABC)
      if (!payload) {
        const segments = window.location.pathname.split("/").filter(Boolean);
        if (segments.length > 0) {
          payload = segments[segments.length - 1];
        }
      }

      // Clean up common file names
      if (!payload || payload === "404" || payload === "404.html" || payload === "index.html") {
        // No compressed path — redirect to home
        window.location.replace("./");
        return;
      }

      try {
        let url;
        try {
          url = decode(payload, "ascii");
        } catch {
          url = decode(payload, "qr");
        }

        // Basic safety: only redirect to http(s) URLs
        if (!/^https?:\/\//i.test(url)) {
          throw new Error("Decoded value is not a valid URL");
        }

        // Show success state briefly
        document.getElementById("loading").style.display = "none";
        document.getElementById("success").style.display = "block";
        document.getElementById("decoded-url").textContent = url;
        document.getElementById("go-link").href = url;

        // Auto‑redirect after a short delay (lets the user see where they're going)
        setTimeout(() => window.location.replace(url), 600);

      } catch (err) {
        console.error("LinkZip decode error:", err);
        document.getElementById("loading").style.display = "none";
        document.getElementById("error-state").style.display = "block";
      }
    })();
  </script>
</body>
</html>
